<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Baby Shower Madeleine</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        button { padding: 10px 15px; background: #d4a373; color: white; border: none; cursor: pointer; }
        .confirmado { color: green; font-weight: bold; }
.pendiente { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Panel de Invitaciones</h2>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre de Familia o Invitado" required style="padding: 10px; width: 60%;">
            <button type="submit">Generar Invitación</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Link Único</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                {% for inv in invitados %}
                <tr>
                    <td>{{ inv.nombre }}</td>
                    <td><a href="/invitacion/{{ inv.token }}" target="_blank">Abrir Link</a></td>
                    <td class="{{ 'confirmado' if inv.confirmado else 'pendiente' }}">
    {{ "Confirmado" if inv.confirmado else "Pendiente" }}
</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
